        criteres: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        prix_min: { type: integer }
        prix_max: { type: integer }
        competences: { type: array, items: { type: string, format: uuid } }
    PackPatch:
      type: object
      additionalProperties: false
      properties:
        titre: { type: string }
        description: { type: string }
        livrable: { type: string }
