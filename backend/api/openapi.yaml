              echeance: { type: string, format: date-time }
              statut_jalon: { type: string }
              montant: { type: integer }
              en_retard: { type: boolean }
              risque: { type: string, enum: [AUCUN, MOYEN, ELEVE] }
              github_milestone: { type: integer, nullable: true }
              points_faits: { type: integer }
              points_prevus: { type: integer }
              sprints:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [numero, debut_prevu, fin_prevue, debut_reel, fin_reelle, statut, points_prevus, points_faits, github_issue]
                  properties:
                    numero: { type: integer }
                    debut_prevu: { type: string, format: date-time }
                    fin_prevue: { type: string, format: date-time }
                    debut_reel: { type: string, format: date-time, nullable: true }
                    fin_reelle: { type: string, format: date-time, nullable: true }
                    statut: { $ref: '#/components/schemas/SprintStatus' }
                    points_prevus: { type: integer }
                    points_faits: { type: integer }
                    github_issue: { type: integer, nullable: true }
        marqueurs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, date, jalon, pr]
            properties:
              type: { type: string, enum: [PREUVE_PR] }
              date: { type: string, format: date-time }
              jalon: { type: integer }
              pr: { type: integer, nullable: true }
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, pseudo, github_login, score_reputation, livraisons_verifiees]
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        github_login: { type: string }
        score_reputation: { type: number }
        livraisons_verifiees: { type: integer }
