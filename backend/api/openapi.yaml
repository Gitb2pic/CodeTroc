openapi: 3.0.3
info:
  title: CodeTroc API
  version: 0.1.0
  description: |
    API de CodeTroc : échange de compétences entre développeurs contre des
    crédits, libérés sur preuve GitHub. Toutes les erreurs suivent la
    RFC 9457 (application/problem+json).

    Limitation de débit : /auth/* par adresse IP, l'API entière par adresse IP,
    les écritures par membre. Au-delà : 429 /problems/trop-de-requetes avec
    l'en-tête Retry-After (secondes).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: 'Le processus est vivant'
      tags: [exploitation]
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /ready:
    get:
      operationId: getReady
      summary: 'Le service peut traiter des requêtes (base joignable)'
      tags: [exploitation]
      responses:
        '200':
          description: Prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/login:
    get:
      operationId: startGitHubLogin
      summary: 'Redirige vers GitHub pour se connecter'
      tags: [auth]
      responses:
        '429': { $ref: '#/components/responses/Problem' }
        '302':
          description: Redirection vers GitHub. Pose le cookie ct_oauth_state.
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: 'Retour de GitHub ; ouvre la session et redirige vers le front'
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/Problem' }
        '302':
          description: Redirection vers le front avec ?connexion=ok ou ?connexion=<code d'erreur>. Pose le cookie ct_refresh en cas de succès.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: 'Échange le cookie ct_refresh contre un jeton d''accès (rotation)'
      tags: [auth]
      responses:
        '429': { $ref: '#/components/responses/Problem' }
        '200':
          description: Nouveau jeton d'accès ; le cookie ct_refresh est remplacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: 'Ferme la session (révoque la famille du jeton de rafraîchissement)'
      tags: [auth]
      responses:
        '429': { $ref: '#/components/responses/Problem' }
        '204':
          description: Session fermée.
  /auth/methodes:
    get:
      operationId: getAuthMethods
      summary: 'Modes de connexion ouverts sur ce serveur'
      tags: [auth]
      responses:
        '429': { $ref: '#/components/responses/Problem' }
        '200':
          description: GitHub et/ou email (l'email exige un serveur SMTP configuré).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [github, email]
                properties:
                  github: { type: boolean }
                  email: { type: boolean }
  /auth/inscription:
    post:
      operationId: registerWithEmail
      summary: 'Créer un compte par email et mot de passe (F18)'
      description: |
        Envoie un lien de confirmation (48 h). La réponse est la même si
        l'adresse est déjà inscrite : son titulaire reçoit alors un email
        « compte existant ». Le bonus de bienvenue est versé à la confirmation.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, mot_de_passe]
              properties:
                email: { type: string, maxLength: 254 }
                mot_de_passe: { type: string, minLength: 10, maxLength: 128 }
                pseudo: { type: string, description: 'Facultatif : déduit de l''adresse sinon.' }
      responses:
        '202': { description: 'Demande prise en compte ; un email est envoyé.' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/connexion:
    post:
      operationId: loginWithPassword
      summary: 'Se connecter par email et mot de passe'
      description: 'Pose le cookie ct_refresh. 401 identifiants-invalides sans distinguer l''adresse inconnue ; 403 email-non-confirme.'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, mot_de_passe]
              properties:
                email: { type: string }
                mot_de_passe: { type: string }
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/email/confirmer:
    post:
      operationId: confirmEmail
      summary: 'Confirmer son adresse avec le jeton reçu par email'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailToken' }
      responses:
        '204': { description: 'Adresse confirmée ; bonus de bienvenue versé.' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/email/renvoyer:
    post:
      operationId: resendConfirmation
      summary: 'Renvoyer le lien de confirmation (réponse identique si l''adresse est inconnue)'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailAddress' }
      responses:
        '202': { description: 'Demande prise en compte.' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/mot-de-passe/oubli:
    post:
      operationId: requestPasswordReset
      summary: 'Recevoir un lien de réinitialisation (1 h ; réponse identique si l''adresse est inconnue)'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailAddress' }
      responses:
        '202': { description: 'Demande prise en compte.' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/mot-de-passe/reinitialiser:
    post:
      operationId: resetPassword
      summary: 'Choisir un nouveau mot de passe ; ferme toutes les sessions du compte'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jeton, mot_de_passe]
              properties:
                jeton: { type: string }
                mot_de_passe: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: 'Mot de passe changé.' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      operationId: getMe
      summary: 'Profil de l''utilisateur connecté'
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMe
      summary: 'Supprimer son compte (anonymisation, D13 ; refusé si un échange est en cours)'
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '204': { description: 'Compte anonymisé, session fermée.' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMe
      summary: 'Modifier son pseudo ou sa bio (bio vide = effacée)'
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pseudo: { type: string }
                bio: { type: string }
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/github/lier:
    post:
      operationId: linkGitHub
      summary: 'Lier un compte GitHub au compte connecté'
      description: |
        Renvoie l'URL d'autorisation GitHub et pose le cookie ct_oauth_state ;
        le retour passe par /auth/github/callback (409 github-deja-lie si ce
        compte GitHub appartient à un autre membre).
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: URL vers laquelle naviguer.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/competences:
    put:
      operationId: setMySkills
      summary: 'Remplacer ses compétences déclarées'
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [competences]
              properties:
                competences:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [id_competence, niveau]
                    properties:
                      id_competence: { type: string, format: uuid }
                      niveau: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: Compétences enregistrées.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSkill' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /competences:
    get:
      operationId: listSkills
      summary: 'Référentiel des compétences'
      tags: [profil]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Compétences.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Skill' } }
  /utilisateurs/{id}:
    get:
      operationId: getPublicProfile
      summary: 'Profil public d''un membre (sans e-mail)'
      tags: [profil]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Profil public.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/Problem' }
  /packs:
    get:
      operationId: listPacks
      summary: 'Catalogue des packs actifs'
      tags: [catalogue]
      parameters:
        - { name: competence, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page de packs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pack' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPack
      summary: 'Créer un pack (administrateur)'
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackInput' }
      responses:
        '201':
          description: Pack créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /packs/{id}:
    get:
      operationId: getPack
      summary: 'Détail d''un pack'
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updatePack
      summary: 'Modifier un pack (administrateur)'
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackPatch' }
      responses:
        '200':
          description: Pack modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres:
    get:
      operationId: listOffers
      summary: 'Offres publiées (écran Catalogue)'
      tags: [catalogue]
      parameters:
        - { name: pack, in: query, schema: { type: string, format: uuid } }
        - { name: prestataire, in: query, schema: { type: string, format: uuid } }
        - { name: competence, in: query, description: 'Libellé exact, ex. Docker', schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: prix_max, in: query, schema: { type: integer } }
        - { name: delai_max, in: query, schema: { type: integer } }
        - { name: reputation_min, in: query, schema: { type: number } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page d'offres.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOffer
      summary: 'Publier une offre sur un pack'
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '403': { $ref: '#/components/responses/Problem' }
        '201':
          description: Offre publiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres/{id}:
    get:
      operationId: getOffer
      summary: 'Détail d''une offre'
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Offre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/Problem' }
  /offres/{id}/retirer:
    post:
      operationId: withdrawOffer
      summary: 'Retirer son offre'
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Offre retirée. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /annonces:
    get:
      operationId: listAnnouncements
      summary: 'Annonces ouvertes (demandes d''aide), ou les miennes avec mes=true (F17)'
      tags: [annonces]
      parameters:
        - { name: pack, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: mes, in: query, description: 'true : mes annonces, tous statuts (authentification requise)', schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page d'annonces.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishAnnouncement
      summary: 'Publier une annonce : le budget doit être couvert par le solde disponible'
      tags: [annonces]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: Annonce publiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /annonces/{id}:
    get:
      operationId: getAnnouncement
      summary: 'Détail d''une annonce ; fermée, elle n''est visible que de son auteur et de ses candidats'
      tags: [annonces]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Annonce.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /annonces/{id}/retirer:
    post:
      operationId: withdrawAnnouncement
      summary: 'Retirer son annonce ouverte ; les candidatures en attente sont refusées'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Annonce retirée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /annonces/{id}/candidatures:
    get:
      operationId: listApplications
      summary: 'Candidatures : toutes pour l''auteur, la sienne pour un prestataire'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Candidatures, de la plus ancienne à la plus récente.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: applyToAnnouncement
      summary: 'Candidater : prix, délai et jalons proposés (somme = prix, RG10)'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '403': { $ref: '#/components/responses/Problem' }
        '201':
          description: Candidature déposée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /annonces/{id}/candidatures/{cid}/accepter:
    post:
      operationId: acceptApplication
      summary: 'Retenir une candidature (auteur) : crée l''échange EN_COURS et bloque le séquestre'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Cid' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Échange créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /annonces/{id}/candidatures/{cid}/refuser:
    post:
      operationId: refuseApplication
      summary: 'Refuser une candidature (auteur)'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Cid' }
      responses:
        '200':
          description: Candidature refusée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /annonces/{id}/candidatures/{cid}/retirer:
    post:
      operationId: withdrawApplication
      summary: 'Retirer sa candidature en attente'
      tags: [annonces]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Cid' }
      responses:
        '200':
          description: Candidature retirée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Problem' }
