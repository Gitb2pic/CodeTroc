            actions: { type: string, nullable: true }
    Story:
      type: object
      additionalProperties: false
      required: [id, jalon, sprint, titre, description, criteres, points, priorite, statut, github_issue, date_creation, date_terminee, cree_par]
      properties:
        id: { type: string, format: uuid }
        jalon: { type: integer, nullable: true }
