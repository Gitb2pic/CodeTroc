      properties:
        id: { type: string, format: uuid }
        titre: { type: string }
        besoin: { type: string }
        depot_url: { type: string }
        budget_credits: { type: integer }
        delai_jours: { type: integer }
        duree_sprint_jours: { type: integer, enum: [7, 14] }
        jalons: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        statut: { type: string, enum: [OUVERTE, POURVUE, RETIREE, EXPIREE] }
        date_publication: { type: string, format: date-time }
        date_expiration: { type: string, format: date-time }
        pack:
          type: object
          additionalProperties: false
          required: [id, titre, type_preuve, competences]
          properties:
            id: { type: string, format: uuid }
            titre: { type: string }
            type_preuve: { $ref: '#/components/schemas/ProofType' }
            competences: { type: array, items: { type: string } }
