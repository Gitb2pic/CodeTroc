openapi: 3.0.3
info:
  title: CodeTroc API
  version: 0.1.0
  description: |
    API de CodeTroc : échange de compétences entre développeurs contre des
    crédits, libérés sur preuve GitHub. Toutes les erreurs suivent la
    RFC 9457 (application/problem+json).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Le processus est vivant
      tags: [exploitation]
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /ready:
    get:
      operationId: getReady
      summary: Le service peut traiter des requêtes (base joignable)
      tags: [exploitation]
      responses:
        '200':
          description: Prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/login:
    get:
      operationId: startGitHubLogin
      summary: Redirige vers GitHub pour se connecter
      tags: [auth]
      responses:
        '302':
          description: Redirection vers GitHub. Pose le cookie ct_oauth_state.
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Retour de GitHub ; ouvre la session et redirige vers le front
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirection vers le front avec ?connexion=ok ou ?connexion=<code d'erreur>. Pose le cookie ct_refresh en cas de succès.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Échange le cookie ct_refresh contre un jeton d'accès (rotation)
      tags: [auth]
      responses:
        '200':
          description: Nouveau jeton d'accès ; le cookie ct_refresh est remplacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Ferme la session (révoque la famille du jeton de rafraîchissement)
      tags: [auth]
      responses:
        '204':
          description: Session fermée.
  /me:
    get:
      operationId: getMe
      summary: Profil de l'utilisateur connecté
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'
  /me/compte:
    get:
      operationId: getMyAccount
      summary: Solde disponible et crédits en séquestre
      tags: [credits]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Soldes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401':
          $ref: '#/components/responses/Problem'
  /me/compte/mouvements:
    get:
      operationId: listMyMovements
      summary: Historique paginé des mouvements de crédits
      tags: [credits]
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de mouvements, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
                  next_cursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Valeur next_cursor de la page précédente.
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Balance:
      type: object
      additionalProperties: false
      required: [disponible, sequestre_sortant, sequestre_entrant]
      properties:
        disponible: { type: integer, description: Crédits dépensables. }
        sequestre_sortant: { type: integer, description: Bloqués pour des échanges où le membre est demandeur. }
        sequestre_entrant: { type: integer, description: Bloqués pour des échanges où le membre est prestataire. }
    Movement:
      type: object
      additionalProperties: false
      required: [id, type, montant, date, id_echange, id_jalon]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [BONUS, BLOCAGE, LIBERATION, REMBOURSEMENT] }
        montant: { type: integer, description: 'Positif si crédité, négatif si débité.' }
        date: { type: string, format: date-time }
        id_echange: { type: string, format: uuid, nullable: true }
        id_jalon: { type: string, format: uuid, nullable: true }
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Durée de validité en secondes. }
        user: { $ref: '#/components/schemas/Me' }
    Me:
      type: object
      additionalProperties: false
      required: [id, pseudo, github_login, role, score_reputation, date_inscription, email, bio]
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        email: { type: string, nullable: true }
        github_login: { type: string }
        bio: { type: string, nullable: true }
        role: { type: string, enum: [MEMBRE, ARBITRE, ADMIN] }
        score_reputation: { type: number }
        date_inscription: { type: string, format: date-time }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          description: Référence URI du type d'erreur, par exemple /problems/introuvable.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: Identifiant de la requête, à citer au support.
