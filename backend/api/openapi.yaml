        points: { type: integer, nullable: true }
        priorite: { type: integer }
        statut: { $ref: '#/components/schemas/StoryStatus' }
        github_issue: { type: integer, nullable: true }
        date_creation: { type: string, format: date-time }
        date_terminee: { type: string, format: date-time, nullable: true }
        cree_par: { type: string, format: uuid }
    ScrumPlanning:
