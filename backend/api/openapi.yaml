      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        email: { type: string, nullable: true }
        github_login: { type: string, description: 'Vide si aucun compte GitHub n''est lié.' }
        github_lie: { type: boolean, description: 'Compte GitHub lié : requis pour proposer une offre ou candidater (F18).' }
        email_verifie: { type: boolean, description: 'Adresse confirmée par lien (comptes email).' }
        bio: { type: string, nullable: true }
        role: { type: string, enum: [MEMBRE, ARBITRE, ADMIN] }
        score_reputation: { type: number }
        date_inscription: { type: string, format: date-time }
    EmailToken:
      type: object
      additionalProperties: false
      required: [jeton]
      properties:
        jeton: { type: string }
    EmailAddress:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
