openapi: 3.1.0
info:
  title: CodeTroc API
  version: 0.1.0
  description: |
    API de CodeTroc : échange de compétences entre développeurs contre des
    crédits, libérés sur preuve GitHub. Toutes les erreurs suivent la
    RFC 9457 (application/problem+json).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Le processus est vivant
      tags: [exploitation]
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /ready:
    get:
      operationId: getReady
      summary: Le service peut traiter des requêtes (base joignable)
      tags: [exploitation]
      responses:
        '200':
          description: Prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          description: Référence URI du type d'erreur, par exemple /problems/introuvable.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: Identifiant de la requête, à citer au support.
