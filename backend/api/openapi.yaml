        titre: { type: string, minLength: 5, maxLength: 120 }
        besoin: { type: string, maxLength: 4000 }
        depot_url: { type: string, example: 'https://github.com/acme/shop-api' }
        budget_credits: { type: integer, minimum: 1 }
        delai_jours: { type: integer, minimum: 1, maximum: 90 }
        duree_sprint_jours: { type: integer, enum: [7, 14], description: 7 par défaut (D20). }
        jalons: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Milestone' } }
    Application:
      type: object
      additionalProperties: false
      required: [id, id_annonce, prix_credits, delai_jours, message, jalons, statut, date_candidature, date_decision, prestataire]
      properties:
        id: { type: string, format: uuid }
        id_annonce: { type: string, format: uuid }
        prix_credits: { type: integer }
        delai_jours: { type: integer }
        message: { type: string }
        jalons: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        statut: { type: string, enum: [EN_ATTENTE, ACCEPTEE, REFUSEE, RETIREE] }
        date_candidature: { type: string, format: date-time }
        date_decision: { type: string, format: date-time, nullable: true }
        prestataire: { $ref: '#/components/schemas/MemberSummary' }
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [prix_credits, delai_jours, jalons]
      properties:
        prix_credits: { type: integer, minimum: 1 }
        delai_jours: { type: integer, minimum: 1, maximum: 90 }
        message: { type: string, maxLength: 2000 }
        jalons: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Milestone' } }
    StoryStatus:
      type: string
      enum: [BACKLOG, A_FAIRE, EN_COURS, EN_REVUE, TERMINE]
    SprintStatus:
      type: string
      enum: [PLANIFIE, ACTIF, TERMINE, ANNULE]
