      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Nombre de notifications marquées.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [marquees]
                properties:
                  marquees: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/utilisateurs:
    get:
      operationId: adminListUsers
      summary: 'Rechercher des membres (administrateur)'
      tags: [administration]
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de membres.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/utilisateurs/{id}:
    patch:
      operationId: adminUpdateUser
      summary: 'Changer le rôle ou suspendre un membre (administrateur, jamais soi-même)'
      tags: [administration]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [MEMBRE, ARBITRE, ADMIN] }
                statut: { type: string, enum: [ACTIF, SUSPENDU] }
      responses:
        '200':
          description: Membre modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/litiges:
    get:
      operationId: adminDisputeQueue
      summary: 'Litiges ouverts sans arbitre (administrateur)'
      tags: [administration]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: File d'attente.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cid:
      name: cid
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clé unique par action (8 à 100 caractères). Rejouer la même requête renvoie la même réponse.'
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
    Cursor:
      name: cursor
      in: query
      description: Valeur next_cursor de la page précédente.
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, id_echange, donnees, lue, date]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [ECHANGE_DEMANDE, ECHANGE_ACCEPTE, ECHANGE_REFUSE, ANNULATION_DEMANDEE, ECHANGE_ANNULE, ECHANGE_TERMINE,
                 JALON_LIVRE, JALON_LIBERE, PREUVE_REJETEE, LITIGE_OUVERT, LITIGE_AFFECTE, LITIGE_REPONSE, LITIGE_DECIDE,
                 MESSAGE_RECU, SECRET_PARTAGE, SECRET_REVELE, AVIS_RECU]
        id_echange: { type: string, format: uuid, nullable: true }
        donnees: { type: object, description: 'Contexte (pack, jalon, montant, id_litige…) ; jamais de secret.' }
        lue: { type: boolean }
        date: { type: string, format: date-time }
    Secret:
      type: object
      additionalProperties: false
      required: [id, id_echange, id_deposant, libelle, type, portee, statut, date_expiration, date_revocation, date_creation]
      properties:
        id: { type: string, format: uuid }
        id_echange: { type: string, format: uuid }
        id_deposant: { type: string, format: uuid }
        libelle: { type: string }
        type: { type: string, enum: [JETON, CLE_API, MOT_DE_PASSE, AUTRE] }
        portee: { type: string, nullable: true }
        statut: { type: string, enum: [ACTIF, EXPIRE, REVOQUE] }
        date_expiration: { type: string, format: date-time }
        date_revocation: { type: string, format: date-time, nullable: true }
        date_creation: { type: string, format: date-time }
    Review:
      type: object
      additionalProperties: false
      required: [id, id_echange, id_auteur, auteur, id_destinataire, note, commentaire, date]
      properties:
        id: { type: string, format: uuid }
        id_echange: { type: string, format: uuid }
        id_auteur: { type: string, format: uuid }
        auteur: { type: string }
        id_destinataire: { type: string, format: uuid }
        note: { type: integer, minimum: 1, maximum: 5 }
        commentaire: { type: string, nullable: true }
        date: { type: string, format: date-time }
    Message:
      type: object
      additionalProperties: false
      required: [id, id_auteur, auteur, contenu, date]
      properties:
        id: { type: string, format: uuid }
        id_auteur: { type: string, format: uuid }
        auteur: { type: string }
        contenu: { type: string }
        date: { type: string, format: date-time }
    Dispute:
      type: object
      additionalProperties: false
      required: [id, id_echange, id_jalon, jalon, montant, ouvert_par, motif, reponse, id_arbitre, statut, decision, part_prestataire, justification, date_ouverture, date_cloture]
      properties:
        id: { type: string, format: uuid }
        id_echange: { type: string, format: uuid }
        id_jalon: { type: string, format: uuid }
        jalon: { type: string }
        montant: { type: integer }
        ouvert_par: { type: string, format: uuid }
        motif: { type: string }
        reponse: { type: string, nullable: true }
        id_arbitre: { type: string, format: uuid, nullable: true }
        statut: { type: string, enum: [OUVERT, CLOS] }
        decision: { type: string, enum: [LIBERER, REMBOURSER, PARTAGER], nullable: true }
        part_prestataire: { type: integer, nullable: true }
        justification: { type: string, nullable: true }
        date_ouverture: { type: string, format: date-time }
        date_cloture: { type: string, format: date-time, nullable: true }
    ExchangeStatus:
      type: string
      enum: [PROPOSE, REFUSE, EN_COURS, EN_LITIGE, TERMINE, ANNULE]
    MilestoneStatus:
      type: string
      enum: [EN_ATTENTE, EN_COURS, LIVRE, CONTESTE, LIBERE, REMBOURSE, PARTAGE]
    Proof:
      type: object
      additionalProperties: false
      required: [id, type, pr_url, pr_numero, sha_commit, statut, detail, note, date_verification, date_creation]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ProofType' }
        pr_url: { type: string, nullable: true }
        pr_numero: { type: integer, nullable: true }
        sha_commit: { type: string, nullable: true }
        statut: { type: string, enum: [EN_ATTENTE, VALIDE, REJETEE] }
        detail: { type: string, nullable: true }
        note: { type: string, nullable: true }
        date_verification: { type: string, format: date-time, nullable: true }
        date_creation: { type: string, format: date-time }
    ExchangeMilestone:
      type: object
      additionalProperties: false
      required: [id, ordre, titre, montant, statut, echeance, date_livraison, date_cloture, preuves]
      properties:
        id: { type: string, format: uuid }
        ordre: { type: integer }
        titre: { type: string }
        montant: { type: integer }
        statut: { $ref: '#/components/schemas/MilestoneStatus' }
        echeance: { type: string, format: date-time, nullable: true }
        date_livraison: { type: string, format: date-time, nullable: true }
        date_cloture: { type: string, format: date-time, nullable: true }
        preuves: { type: array, items: { $ref: '#/components/schemas/Proof' } }
    Exchange:
      type: object
      additionalProperties: false
      required: [id, statut, montant_total, delai_jours, depot_url, besoin, date_creation, date_acceptation, date_cloture,
                 annulation_demandee_par, demandeur, prestataire, offre, id_annonce, jalons, sequestre, a_qui_de_jouer]
      properties:
        id: { type: string, format: uuid }
        statut: { $ref: '#/components/schemas/ExchangeStatus' }
        montant_total: { type: integer }
        delai_jours: { type: integer }
        depot_url: { type: string }
        besoin: { type: string }
        date_creation: { type: string, format: date-time }
        date_acceptation: { type: string, format: date-time, nullable: true }
        date_cloture: { type: string, format: date-time, nullable: true }
        annulation_demandee_par: { type: string, format: uuid, nullable: true }
        demandeur: { $ref: '#/components/schemas/MemberSummary' }
        prestataire: { $ref: '#/components/schemas/MemberSummary' }
        offre:
          type: object
          additionalProperties: false
          required: [id, titre, pack, type_preuve]
          properties:
            id: { type: string, format: uuid, nullable: true, description: Offre d'origine ; null pour un échange né d'une annonce (F17). }
            titre: { type: string }
            pack: { type: string }
            type_preuve: { $ref: '#/components/schemas/ProofType' }
        id_annonce: { type: string, format: uuid, nullable: true, description: Annonce d'origine (F17) ; null pour un échange né d'une offre. }
        jalons: { type: array, items: { $ref: '#/components/schemas/ExchangeMilestone' } }
        sequestre:
          type: object
          additionalProperties: false
          required: [bloque, libere, rembourse]
          properties:
            bloque: { type: integer }
            libere: { type: integer }
            rembourse: { type: integer }
        a_qui_de_jouer: { type: string, enum: [DEMANDEUR, PRESTATAIRE, ARBITRE, AUCUN] }
    Level:
      type: string
      enum: [DEBUTANT, INTERMEDIAIRE, CONFIRME, EXPERT]
    Skill:
      type: object
      additionalProperties: false
      required: [id, libelle, categorie]
      properties:
        id: { type: string, format: uuid }
        libelle: { type: string }
        categorie: { type: string }
    UserSkill:
      type: object
      additionalProperties: false
      required: [id, libelle, niveau]
      properties:
        id: { type: string, format: uuid }
        libelle: { type: string }
        niveau: { $ref: '#/components/schemas/Level' }
    PublicProfile:
      type: object
      additionalProperties: false
