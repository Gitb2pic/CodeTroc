        template: { type: string }
        objectif_produit: { type: string }
        definition_of_done: { type: array, items: { type: string } }
        definition_of_ready: { type: array, items: { type: string } }
        colonnes: { type: array, items: { $ref: '#/components/schemas/StoryStatus' } }
        points_possibles: { type: array, items: { type: integer } }
        gabarit_story: { type: string }
        duree_sprint_jours: { type: integer, enum: [7, 14] }
        statut_synchro: { type: string, enum: [INACTIVE, ACTIVE, PERMISSION_MANQUANTE, ERREUR] }
        detail_synchro: { type: string, nullable: true }
        appels_github_en_attente: { type: integer }
        mon_role: { type: string, enum: [PRODUCT_OWNER, EQUIPE_DEV, ARBITRE] }
        avenant_en_cours:
          allOf: [{ $ref: '#/components/schemas/Amendment' }]
          nullable: true
        date_creation: { type: string, format: date-time }
    Sprint:
      type: object
      additionalProperties: false
      required: [id, numero, jalon, debut_prevu, fin_prevue, debut_reel, fin_reelle, statut, objectif, github_issue, points_prevus, points_faits, retro]
      properties:
        id: { type: string, format: uuid }
