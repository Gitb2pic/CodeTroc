openapi: 3.0.3
info:
  title: CodeTroc API
  version: 0.1.0
  description: |
    API de CodeTroc : échange de compétences entre développeurs contre des
    crédits, libérés sur preuve GitHub. Toutes les erreurs suivent la
    RFC 9457 (application/problem+json).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Le processus est vivant
      tags: [exploitation]
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /ready:
    get:
      operationId: getReady
      summary: Le service peut traiter des requêtes (base joignable)
      tags: [exploitation]
      responses:
        '200':
          description: Prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/login:
    get:
      operationId: startGitHubLogin
      summary: Redirige vers GitHub pour se connecter
      tags: [auth]
      responses:
        '302':
          description: Redirection vers GitHub. Pose le cookie ct_oauth_state.
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Retour de GitHub ; ouvre la session et redirige vers le front
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirection vers le front avec ?connexion=ok ou ?connexion=<code d'erreur>. Pose le cookie ct_refresh en cas de succès.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Échange le cookie ct_refresh contre un jeton d'accès (rotation)
      tags: [auth]
      responses:
        '200':
          description: Nouveau jeton d'accès ; le cookie ct_refresh est remplacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Ferme la session (révoque la famille du jeton de rafraîchissement)
      tags: [auth]
      responses:
        '204':
          description: Session fermée.
  /me:
    get:
      operationId: getMe
      summary: Profil de l'utilisateur connecté
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      summary: Modifier son pseudo ou sa bio (bio vide = effacée)
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pseudo: { type: string }
                bio: { type: string }
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/competences:
    put:
      operationId: setMySkills
      summary: Remplacer ses compétences déclarées
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [competences]
              properties:
                competences:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [id_competence, niveau]
                    properties:
                      id_competence: { type: string, format: uuid }
                      niveau: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: Compétences enregistrées.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSkill' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /competences:
    get:
      operationId: listSkills
      summary: Référentiel des compétences
      tags: [profil]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Compétences.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Skill' } }
  /utilisateurs/{id}:
    get:
      operationId: getPublicProfile
      summary: Profil public d'un membre (sans e-mail)
      tags: [profil]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Profil public.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/Problem' }
  /packs:
    get:
      operationId: listPacks
      summary: Catalogue des packs actifs
      tags: [catalogue]
      parameters:
        - { name: competence, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page de packs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pack' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPack
      summary: Créer un pack (administrateur)
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackInput' }
      responses:
        '201':
          description: Pack créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /packs/{id}:
    get:
      operationId: getPack
      summary: Détail d'un pack
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updatePack
      summary: Modifier un pack (administrateur)
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackPatch' }
      responses:
        '200':
          description: Pack modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres:
    get:
      operationId: listOffers
      summary: Offres publiées (écran Catalogue)
      tags: [catalogue]
      parameters:
        - { name: pack, in: query, schema: { type: string, format: uuid } }
        - { name: prestataire, in: query, schema: { type: string, format: uuid } }
        - { name: competence, in: query, description: 'Libellé exact, ex. Docker', schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: prix_max, in: query, schema: { type: integer } }
        - { name: delai_max, in: query, schema: { type: integer } }
        - { name: reputation_min, in: query, schema: { type: number } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page d'offres.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOffer
      summary: Publier une offre sur un pack
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '201':
          description: Offre publiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres/{id}:
    get:
      operationId: getOffer
      summary: Détail d'une offre
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Offre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/Problem' }
  /offres/{id}/retirer:
    post:
      operationId: withdrawOffer
      summary: Retirer son offre
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Offre retirée. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/compte:
    get:
      operationId: getMyAccount
      summary: Solde disponible et crédits en séquestre
      tags: [credits]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Soldes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401':
          $ref: '#/components/responses/Problem'
  /me/compte/mouvements:
    get:
      operationId: listMyMovements
      summary: Historique paginé des mouvements de crédits
      tags: [credits]
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de mouvements, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
                  next_cursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Valeur next_cursor de la page précédente.
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Level:
      type: string
      enum: [DEBUTANT, INTERMEDIAIRE, CONFIRME, EXPERT]
    Skill:
      type: object
      additionalProperties: false
      required: [id, libelle, categorie]
      properties:
        id: { type: string, format: uuid }
        libelle: { type: string }
        categorie: { type: string }
    UserSkill:
      type: object
      additionalProperties: false
      required: [id, libelle, niveau]
      properties:
        id: { type: string, format: uuid }
        libelle: { type: string }
        niveau: { $ref: '#/components/schemas/Level' }
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, pseudo, github_login, bio, score_reputation, date_inscription, competences, livraisons_verifiees, avis_recus]
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        github_login: { type: string }
        bio: { type: string, nullable: true }
        score_reputation: { type: number }
        date_inscription: { type: string, format: date-time }
        competences: { type: array, items: { $ref: '#/components/schemas/UserSkill' } }
        livraisons_verifiees: { type: integer }
        avis_recus: { type: integer }
    Criterion:
      type: object
      additionalProperties: false
      required: [texte, verification]
      properties:
        texte: { type: string }
        verification: { type: string, enum: [CI, SCAN, REVUE] }
    Milestone:
      type: object
      additionalProperties: false
      required: [titre, montant]
      properties:
        titre: { type: string, maxLength: 120 }
        montant: { type: integer, minimum: 1 }
    ProofType:
      type: string
      enum: [PR_CI, MANUELLE]
      description: 'PR_CI : PR mergée et CI au vert. MANUELLE : validation par le demandeur.'
    Pack:
      type: object
      additionalProperties: false
      required: [id, titre, description, livrable, type_preuve, criteres, prix_min, prix_max, actif, competences, date_creation]
      properties:
        id: { type: string, format: uuid }
        titre: { type: string }
        description: { type: string }
        livrable: { type: string }
        type_preuve: { $ref: '#/components/schemas/ProofType' }
        criteres: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        prix_min: { type: integer }
        prix_max: { type: integer }
        actif: { type: boolean }
        competences: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        date_creation: { type: string, format: date-time }
    PackInput:
      type: object
      additionalProperties: false
      required: [titre, description, livrable, type_preuve, criteres, prix_min, prix_max, competences]
      properties:
        titre: { type: string }
        description: { type: string }
        livrable: { type: string }
        type_preuve: { $ref: '#/components/schemas/ProofType' }
        criteres: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        prix_min: { type: integer }
        prix_max: { type: integer }
        competences: { type: array, items: { type: string, format: uuid } }
    PackPatch:
      type: object
      additionalProperties: false
      properties:
        titre: { type: string }
        description: { type: string }
        livrable: { type: string }
        type_preuve: { $ref: '#/components/schemas/ProofType' }
        criteres: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        prix_min: { type: integer }
        prix_max: { type: integer }
        competences: { type: array, items: { type: string, format: uuid } }
        actif: { type: boolean }
    Offer:
      type: object
      additionalProperties: false
      required: [id, titre, description, prix_credits, delai_jours, jalons, statut, date_publication, pack, prestataire]
      properties:
        id: { type: string, format: uuid }
        titre: { type: string }
        description: { type: string }
        prix_credits: { type: integer }
        delai_jours: { type: integer }
        jalons: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        statut: { type: string, enum: [PUBLIEE, RETIREE] }
        date_publication: { type: string, format: date-time }
        pack:
          type: object
          additionalProperties: false
          required: [id, titre, type_preuve, competences]
          properties:
            id: { type: string, format: uuid }
            titre: { type: string }
            type_preuve: { $ref: '#/components/schemas/ProofType' }
            competences: { type: array, items: { type: string } }
        prestataire: { $ref: '#/components/schemas/MemberSummary' }
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, pseudo, github_login, score_reputation, livraisons_verifiees]
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        github_login: { type: string }
        score_reputation: { type: number }
        livraisons_verifiees: { type: integer }
    OfferInput:
      type: object
      additionalProperties: false
      required: [id_pack, titre, prix_credits, delai_jours, jalons]
      properties:
        id_pack: { type: string, format: uuid }
        titre: { type: string }
        description: { type: string }
        prix_credits: { type: integer }
        delai_jours: { type: integer }
        jalons: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
    Balance:
      type: object
      additionalProperties: false
      required: [disponible, sequestre_sortant, sequestre_entrant]
      properties:
        disponible: { type: integer, description: Crédits dépensables. }
        sequestre_sortant: { type: integer, description: Bloqués pour des échanges où le membre est demandeur. }
        sequestre_entrant: { type: integer, description: Bloqués pour des échanges où le membre est prestataire. }
    Movement:
      type: object
      additionalProperties: false
      required: [id, type, montant, date, id_echange, id_jalon]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [BONUS, BLOCAGE, LIBERATION, REMBOURSEMENT] }
        montant: { type: integer, description: 'Positif si crédité, négatif si débité.' }
        date: { type: string, format: date-time }
        id_echange: { type: string, format: uuid, nullable: true }
        id_jalon: { type: string, format: uuid, nullable: true }
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Durée de validité en secondes. }
        user: { $ref: '#/components/schemas/Me' }
    Me:
      type: object
      additionalProperties: false
      required: [id, pseudo, github_login, role, score_reputation, date_inscription, email, bio]
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        email: { type: string, nullable: true }
        github_login: { type: string }
        bio: { type: string, nullable: true }
        role: { type: string, enum: [MEMBRE, ARBITRE, ADMIN] }
        score_reputation: { type: number }
        date_inscription: { type: string, format: date-time }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          description: Référence URI du type d'erreur, par exemple /problems/introuvable.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: Identifiant de la requête, à citer au support.
