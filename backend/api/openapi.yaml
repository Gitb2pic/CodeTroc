openapi: 3.0.3
info:
  title: CodeTroc API
  version: 0.1.0
  description: |
    API de CodeTroc : échange de compétences entre développeurs contre des
    crédits, libérés sur preuve GitHub. Toutes les erreurs suivent la
    RFC 9457 (application/problem+json).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: 'Le processus est vivant'
      tags: [exploitation]
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /ready:
    get:
      operationId: getReady
      summary: 'Le service peut traiter des requêtes (base joignable)'
      tags: [exploitation]
      responses:
        '200':
          description: Prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/login:
    get:
      operationId: startGitHubLogin
      summary: 'Redirige vers GitHub pour se connecter'
      tags: [auth]
      responses:
        '302':
          description: Redirection vers GitHub. Pose le cookie ct_oauth_state.
        '503':
          $ref: '#/components/responses/Problem'
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: 'Retour de GitHub ; ouvre la session et redirige vers le front'
      tags: [auth]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirection vers le front avec ?connexion=ok ou ?connexion=<code d'erreur>. Pose le cookie ct_refresh en cas de succès.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: 'Échange le cookie ct_refresh contre un jeton d''accès (rotation)'
      tags: [auth]
      responses:
        '200':
          description: Nouveau jeton d'accès ; le cookie ct_refresh est remplacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: 'Ferme la session (révoque la famille du jeton de rafraîchissement)'
      tags: [auth]
      responses:
        '204':
          description: Session fermée.
  /me:
    get:
      operationId: getMe
      summary: 'Profil de l''utilisateur connecté'
      tags: [profil]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      summary: 'Modifier son pseudo ou sa bio (bio vide = effacée)'
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pseudo: { type: string }
                bio: { type: string }
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/competences:
    put:
      operationId: setMySkills
      summary: 'Remplacer ses compétences déclarées'
      tags: [profil]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [competences]
              properties:
                competences:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [id_competence, niveau]
                    properties:
                      id_competence: { type: string, format: uuid }
                      niveau: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: Compétences enregistrées.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSkill' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /competences:
    get:
      operationId: listSkills
      summary: 'Référentiel des compétences'
      tags: [profil]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Compétences.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Skill' } }
  /utilisateurs/{id}:
    get:
      operationId: getPublicProfile
      summary: 'Profil public d''un membre (sans e-mail)'
      tags: [profil]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Profil public.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/Problem' }
  /packs:
    get:
      operationId: listPacks
      summary: 'Catalogue des packs actifs'
      tags: [catalogue]
      parameters:
        - { name: competence, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page de packs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Pack' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPack
      summary: 'Créer un pack (administrateur)'
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackInput' }
      responses:
        '201':
          description: Pack créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /packs/{id}:
    get:
      operationId: getPack
      summary: 'Détail d''un pack'
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updatePack
      summary: 'Modifier un pack (administrateur)'
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackPatch' }
      responses:
        '200':
          description: Pack modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pack' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres:
    get:
      operationId: listOffers
      summary: 'Offres publiées (écran Catalogue)'
      tags: [catalogue]
      parameters:
        - { name: pack, in: query, schema: { type: string, format: uuid } }
        - { name: prestataire, in: query, schema: { type: string, format: uuid } }
        - { name: competence, in: query, description: 'Libellé exact, ex. Docker', schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: prix_max, in: query, schema: { type: integer } }
        - { name: delai_max, in: query, schema: { type: integer } }
        - { name: reputation_min, in: query, schema: { type: number } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Page d'offres.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOffer
      summary: 'Publier une offre sur un pack'
      tags: [catalogue]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '201':
          description: Offre publiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /offres/{id}:
    get:
      operationId: getOffer
      summary: 'Détail d''une offre'
      tags: [catalogue]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Problem' }
        '200':
          description: Offre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '404': { $ref: '#/components/responses/Problem' }
  /offres/{id}/retirer:
    post:
      operationId: withdrawOffer
      summary: 'Retirer son offre'
      tags: [catalogue]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Offre retirée. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /echanges:
    get:
      operationId: listMyExchanges
      summary: 'Mes échanges (demandeur ou prestataire)'
      tags: [echanges]
      security: [{ bearer: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [demandeur, prestataire] } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/ExchangeStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page d'échanges.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Exchange' } }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestExchange
      summary: 'Demander un échange à partir d''une offre (aucun crédit bloqué avant acceptation)'
      tags: [echanges]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_offre, depot_url]
              properties:
                id_offre: { type: string, format: uuid }
                depot_url: { type: string, example: 'https://github.com/acme/shop-api' }
                besoin: { type: string, maxLength: 4000 }
                jalons: { type: array, items: { $ref: '#/components/schemas/Milestone' }, description: 'Facultatif : jalons de l''offre par défaut.' }
      responses:
        '201':
          description: Échange proposé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /echanges/{id}:
    get:
      operationId: getExchange
      summary: 'Détail d''un échange (parties et arbitre)'
      tags: [echanges]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Échange.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /echanges/{id}/accepter:
    post:
      operationId: acceptExchange
      summary: 'Accepter (prestataire) : bloque le montant en séquestre'
      tags: [echanges]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Échange après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /echanges/{id}/refuser:
    post:
      operationId: refuseExchange
      summary: 'Refuser une demande (prestataire)'
      tags: [echanges]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Échange après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /echanges/{id}/annuler:
    post:
      operationId: cancelExchange
      summary: 'Annuler (demandeur si proposé ; accord des deux parties ou abandon après échéance si en cours)'
      tags: [echanges]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Échange après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /jalons/{id}/preuves:
    post:
      operationId: submitProof
      summary: 'Livrer le jalon en cours (prestataire) : URL de PR pour un pack PR_CI, note pour un pack MANUELLE'
      tags: [livraison]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pr_url: { type: string, example: 'https://github.com/acme/shop-api/pull/42' }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Échange mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /jalons/{id}/reverifier:
    post:
      operationId: reverifyMilestone
      summary: 'Relancer la vérification GitHub des preuves du jalon'
      tags: [livraison]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Échange mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /jalons/{id}/valider:
    post:
      operationId: validateMilestone
      summary: 'Valider un jalon livré et libérer ses crédits (demandeur)'
      tags: [livraison]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Échange mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /webhooks/github:
    post:
      operationId: githubWebhook
      summary: 'Réception des webhooks de la GitHub App (pull_request, check_suite, check_run)'
      tags: [livraison]
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Webhook traité.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [doublon, preuves_verifiees]
                properties:
                  doublon: { type: boolean }
                  preuves_verifiees: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/compte:
    get:
      operationId: getMyAccount
      summary: 'Solde disponible et crédits en séquestre'
      tags: [credits]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Soldes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401':
          $ref: '#/components/responses/Problem'
  /me/compte/mouvements:
    get:
      operationId: listMyMovements
      summary: 'Historique paginé des mouvements de crédits'
      tags: [credits]
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de mouvements, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
                  next_cursor: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clé unique par action (8 à 100 caractères). Rejouer la même requête renvoie la même réponse.'
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
    Cursor:
      name: cursor
      in: query
      description: Valeur next_cursor de la page précédente.
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ExchangeStatus:
      type: string
      enum: [PROPOSE, REFUSE, EN_COURS, EN_LITIGE, TERMINE, ANNULE]
    MilestoneStatus:
      type: string
      enum: [EN_ATTENTE, EN_COURS, LIVRE, CONTESTE, LIBERE, REMBOURSE, PARTAGE]
    Proof:
      type: object
      additionalProperties: false
      required: [id, type, pr_url, pr_numero, sha_commit, statut, detail, note, date_verification, date_creation]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ProofType' }
        pr_url: { type: string, nullable: true }
        pr_numero: { type: integer, nullable: true }
        sha_commit: { type: string, nullable: true }
        statut: { type: string, enum: [EN_ATTENTE, VALIDE, REJETEE] }
        detail: { type: string, nullable: true }
        note: { type: string, nullable: true }
        date_verification: { type: string, format: date-time, nullable: true }
        date_creation: { type: string, format: date-time }
    ExchangeMilestone:
      type: object
      additionalProperties: false
      required: [id, ordre, titre, montant, statut, echeance, date_livraison, date_cloture, preuves]
      properties:
        id: { type: string, format: uuid }
        ordre: { type: integer }
        titre: { type: string }
        montant: { type: integer }
        statut: { $ref: '#/components/schemas/MilestoneStatus' }
        echeance: { type: string, format: date-time, nullable: true }
        date_livraison: { type: string, format: date-time, nullable: true }
        date_cloture: { type: string, format: date-time, nullable: true }
        preuves: { type: array, items: { $ref: '#/components/schemas/Proof' } }
    Exchange:
      type: object
      additionalProperties: false
      required: [id, statut, montant_total, delai_jours, depot_url, besoin, date_creation, date_acceptation, date_cloture,
                 annulation_demandee_par, demandeur, prestataire, offre, jalons, sequestre, a_qui_de_jouer]
      properties:
        id: { type: string, format: uuid }
        statut: { $ref: '#/components/schemas/ExchangeStatus' }
        montant_total: { type: integer }
        delai_jours: { type: integer }
        depot_url: { type: string }
        besoin: { type: string }
        date_creation: { type: string, format: date-time }
        date_acceptation: { type: string, format: date-time, nullable: true }
