version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - nolintlint
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Les tests construisent des requêtes httptest sans contexte.
      - path: _test\.go
        linters: [noctx]
      # Fixtures de test : clés et URL factices, conversions sur des petits entiers.
      - path: _test\.go
        linters: [gosec]
        text: "G101|G115"
formatters:
  enable:
    - gofmt
    - goimports
