# Environnement local CodeTroc : PostgreSQL, migrations, API et Traefik.
# Prérequis : ./scripts/dev-secrets.sh (génère ./secrets/).
# API : http://localhost:8000/api/v1/health
name: codetroc

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=codetroc_edge
      - --entrypoints.web.address=:80
    ports: ["8000:80"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codetroc
      POSTGRES_USER: codetroc
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetroc -d codetroc"]
      interval: 5s
      retries: 10
    networks: [backend]          # aucun port publié

  migrate:
    build: ./backend
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SIGNING_KEY_FILE: /run/secrets/jwt_key
      VAULT_KEK_FILE: /run/secrets/vault_kek
      TRUSTED_PROXIES: 172.30.0.0/24
      PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173/
      COOKIE_SECURE: "false"          # HTTP en local uniquement
      # Connexion GitHub (facultative en local) : à définir dans .env
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    secrets: [database_url, jwt_key, vault_kek]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.http.services.api.loadbalancer.healthcheck.path=/api/v1/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=10s
    networks: [edge, backend]

networks:
  edge:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  backend:
    internal: true

volumes:
  pgdata: {}

secrets:
  db_password: { file: ./secrets/db_password }
  database_url: { file: ./secrets/database_url }
  jwt_key: { file: ./secrets/jwt_key }
  vault_kek: { file: ./secrets/vault_kek }
