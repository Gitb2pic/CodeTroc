name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "compose.yaml", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.14.0, working-directory: backend }

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codetroc_test
          POSTGRES_USER: codetroc
          POSTGRES_PASSWORD: codetroc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codetroc -d codetroc_test"
          --health-interval 5s --health-retries 10
    env:
      CODETROC_TEST_DATABASE_URL: postgres://codetroc:codetroc@localhost:5432/codetroc_test?sslmode=disable
      CODETROC_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      # Bac à sable navigateur (backend compilé en WebAssembly) et serveur e2e.
      - run: GOOS=js GOARCH=wasm go vet ./cmd/sandbox && go vet -tags e2e ./cmd/e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gitleaks
        working-directory: .
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t codetroc-api:${{ github.sha }} .
      - name: compose valide
        working-directory: .
        run: ./scripts/dev-secrets.sh && docker compose config -q
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: codetroc-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
