name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:api
      # Le client typé doit refléter la spec : régénérer ne doit rien changer.
      - run: npm run api:types && git diff --exit-code src/api/schema.ts
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: codetroc_e2e, POSTGRES_USER: codetroc, POSTGRES_PASSWORD: codetroc }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codetroc -d codetroc_e2e"
          --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://codetroc:codetroc@localhost:5432/codetroc_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results }
